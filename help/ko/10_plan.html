<h1 id="plan.chapter">평면 도어 · 창문</h1>
<p>건축 평면도에 쓰이는 문/창문 기호를 삽입하는 도구입니다.</p>

<h2 id="plandoor.type1">외여닫이(F) <span style="color:#888;font-size:12px;">(pd1)</span></h2>
<p>한쪽으로 여닫는 평면 문 기호를 삽입합니다.</p>

<h2 id="plandoor.double">쌍여닫이(F) <span style="color:#888;font-size:12px;">(pd2)</span></h2>
<p>양쪽 두 짝이 여닫히는 평면 문 기호를 삽입합니다.</p>

<h2 id="plandoor.biswing">양방여닫이(F) <span style="color:#888;font-size:12px;">(pd3)</span></h2>
<p>양방향(안팎)으로 열리는 자재문 기호를 삽입합니다.</p>

<h2 id="plandoor.doublebiswing">양방쌍여닫이(F) <span style="color:#888;font-size:12px;">(pd4)</span></h2>
<p>양방향으로 열리는 쌍여닫이 자재문 기호를 삽입합니다.</p>

<h2 id="plandoor.revolving">회전문(F) <span style="color:#888;font-size:12px;">(pd5)</span></h2>
<p>회전문 기호를 삽입합니다.</p>

<h2 id="planwindow.type1">미서기창(DF) <span style="color:#888;font-size:12px;">(pw1)</span></h2>
<p>미닫이(슬라이딩) 창문 기호를 삽입합니다.</p>
