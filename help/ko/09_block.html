<h1 id="block.chapter">블록</h1>
<p>반복해서 사용하는 도형을 블록으로 등록하고 불러오는 기능, 기본 제공 가구/설비 라이브러리입니다.</p>

<h2 id="block.wblock">만들기 <span style="color:#888;font-size:12px;">(WB)</span></h2>
<p>선택한 요소를 재사용 가능한 블록으로 등록합니다.</p>

<h2 id="block.insert">불러오기 <span style="color:#888;font-size:12px;">(In)</span></h2>
<p>등록된 블록을 도면에 삽입합니다.</p>

<h2 id="block.lib.furniture">가구</h2>
<p>가구 블록 라이브러리에서 항목을 선택해 삽입합니다.</p>

<h2 id="block.lib.sink">싱크대</h2>
<p>싱크대 블록 라이브러리에서 항목을 선택해 삽입합니다.</p>

<h2 id="block.lib.toilet">화장실</h2>
<p>화장실 설비 블록 라이브러리에서 항목을 선택해 삽입합니다.</p>

<h2 id="block.lib.tree">나무</h2>
<p>조경(나무) 블록 라이브러리에서 항목을 선택해 삽입합니다.</p>
